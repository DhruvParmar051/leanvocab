[project]
name = "leanvocab"
version = "0.1.0"
description = "Controlled study of small-vocabulary English tokenizers for sentence-embedding encoders"
authors = [
    { name = "DhruvParmar051", email = "dhruvparmar051@outlook.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==5.0.1",
    "huggingface-hub==1.31.0",
    "matplotlib==3.11.2",
    "mlx==0.32.2",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "tokenization-scorer==1.1.8",
    "tokenizers==0.23.2",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "torch==2.14.0",
    "transformers==5.17.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# `tokenizers` trainer constructors ship without annotations.
module = "leanvocab.tokenizers.*"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# MLX ships partial stubs that mypy cannot resolve (e.g. mlx.nn.LayerNorm); treat it as Any.
module = ["mlx", "mlx.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["leanvocab.model.*", "leanvocab.pretrain.*", "leanvocab.finetune.*", "leanvocab.eval.*"]
disallow_subclassing_any = false
disallow_any_generics = false
warn_return_any = false
