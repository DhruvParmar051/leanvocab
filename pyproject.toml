[project]
name = "tokstudy"
version = "0.1.0"
description = "Controlled study of small-vocabulary English tokenizers for sentence-embedding encoders"
authors = [
    { name = "DhruvParmar051", email = "dhruvparmar051@outlook.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==5.0.1",
    "huggingface-hub==1.31.0",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "tokenizers==0.23.2",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# `tokenizers` trainer constructors ship without annotations.
module = "tokstudy.tokenizers.*"
disallow_untyped_calls = false
